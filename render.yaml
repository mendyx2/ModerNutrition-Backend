# ==============================================================================
# ModerNutrition Backend — Render Blueprint Specification
# Provisions Laravel Web API + Managed Database + Queue Worker
# ==============================================================================

services:
  # 1. Main Laravel API Web Service
  - type: web
    name: modernutrition-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/products
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

  # 2. Background Queue Worker (Optional: for asynchronous ledger jobs)
  - type: worker
    name: modernutrition-worker
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --tries=3 --timeout=90
    envVars:
      - fromService:
          type: web
          name: modernutrition-api
          envVarKey: APP_KEY
      - fromService:
          type: web
          name: modernutrition-api
          envVarKey: DB_HOST
      - fromService:
          type: web
          name: modernutrition-api
          envVarKey: DB_DATABASE
      - fromService:
          type: web
          name: modernutrition-api
          envVarKey: DB_USERNAME
      - fromService:
          type: web
          name: modernutrition-api
          envVarKey: DB_PASSWORD
