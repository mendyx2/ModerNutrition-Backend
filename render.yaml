# ==============================================================================
# ModerNutrition Backend — Render Blueprint Specification (Fixed)
# ==============================================================================

databases:
  - name: modernutrition-db
    databaseName: modernutrition
    user: modernutrition_user
    region: oregon
    plan: free

services:
  # 1. Main Laravel API Web Service
  - type: web
    name: modernutrition-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/products
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: modernutrition-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: modernutrition-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: modernutrition-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: modernutrition-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: modernutrition-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

  # 2. Background Queue Worker (Processes asynchronous CV allocation ledger jobs)
  - type: worker
    name: modernutrition-worker
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        fromService:
          type: web
          name: modernutrition-api
          envVarKey: APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: modernutrition-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: modernutrition-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: modernutrition-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: modernutrition-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: modernutrition-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
